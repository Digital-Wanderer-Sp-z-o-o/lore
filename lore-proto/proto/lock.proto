syntax = "proto3";

import "google/protobuf/timestamp.proto";

package urc.lock;

// Represents the resource being locked in the repository
message Resource {
  // Branch ID
  bytes branch = 1;

  // Hash for the resource
  bytes hash = 2;

  // Human readable description of the resource (i.e. file path, property name,
  // etc)
  string description = 3;
}

// Represents the lock on a resource
message Lock {
  // Resource reference
  Resource resource = 1;

  // The server will store the user's ID provided with the
  // request's auth info
  string owner = 2;

  // Lock timestamp
  google.protobuf.Timestamp locked_at = 3;
}

//////////////////////////////////
// RPC service definitions
//

service LockService {
  // Locks resources, errors if already locked
  rpc Lock(LockRequest) returns (LockResponse);

  // Query for locks
  rpc Query(QueryRequest) returns (QueryResponse);

  // Get lock status
  rpc Status(StatusRequest) returns (StatusResponse);

  // Unlocks resources, no-ops if no lock exists
  rpc Unlock(UnlockRequest) returns (UnlockResponse);

  // Locks resources for another user
  rpc AdminLock(AdminLockRequest) returns (AdminLockResponse);

  // Lists durable administrative lock-recovery events for the repository.
  rpc QueryRecoveryAudit(RecoveryAuditRequest) returns (RecoveryAuditResponse);
}

message LockRequest { repeated Resource resources = 1; }

message LockResponse {
  // List of created locks
  repeated Lock locks = 1;
}

message QueryRequest {
  optional bytes branch = 1;
  optional string owner = 2;
  optional string description = 3;
}

message QueryResponse { repeated Lock result = 1; }

message StatusRequest { repeated Resource resources = 1; }

message StatusResponse {
  // List of locks found
  // NOTE: We might want to consider just boolean returns in order?
  repeated Lock locks = 1;
}

message UnlockRequest {
  repeated Resource resources = 1;

  // When present, every lock must still belong to this owner. The server uses
  // the authenticated caller when omitted and permits a different owner only
  // for repository administrators.
  optional string expected_owner = 2;
}

message UnlockResponse {
  // List of resources unlocked
  // NOTE: Same as above, maybe booleans in order?
  repeated Resource resources = 1;
}

message AdminLockRequest {
  repeated Resource resources = 1;
  string owner = 2;
}

message AdminLockResponse {
  // List of created locks
  repeated Lock locks = 1;
}

message RecoveryAuditCursor {
  // UUID identifying the final event in the previous page.
  bytes event_id = 1;

  // Timestamp of the final event in the previous page.
  google.protobuf.Timestamp recorded_at = 2;
}

message RecoveryAuditEntry {
  // Stable UUID of this audit event.
  bytes event_id = 1;

  // Authenticated user who performed the recovery.
  string actor = 2;

  // Owner compared atomically before the locks were released.
  string expected_owner = 3;

  // Exact resources released by the administrative recovery.
  repeated Resource resources = 4;

  // Server-side time at which the recovery was persisted.
  google.protobuf.Timestamp recorded_at = 5;
}

message RecoveryAuditRequest {
  // Page size from 1 through 100.
  uint32 limit = 1;

  // Exclusive cursor returned by the previous page.
  optional RecoveryAuditCursor cursor = 2;
}

message RecoveryAuditResponse {
  repeated RecoveryAuditEntry events = 1;
  optional RecoveryAuditCursor next_cursor = 2;
}
