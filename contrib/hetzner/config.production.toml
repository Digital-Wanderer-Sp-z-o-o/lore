# Single-node Archigma production profile. The local store is a disposable
# cache. The promoted Cloudflare Durable Objects and R2 bucket remain the
# source of truth and must not be recreated during this cutover.

[server.http]
host = "127.0.0.1"

[server.quic]
host = "0.0.0.0"
port = 443
verify_client_certs = false
idle_timeout = 300_000
handler_timeout_seconds = 300

[server.quic.certificate]
# The certificate lineage retains the legacy Rendermoon filename, but its SAN
# covers both lore.archigma.com and lore.rendermoon.com. Do not request a new
# lineage during the data-preserving production cutover.
cert_file = "/etc/letsencrypt/live/lore.rendermoon.com/fullchain.pem"
pkey_file = "/etc/letsencrypt/live/lore.rendermoon.com/privkey.pem"

[server.grpc]
host = "0.0.0.0"
port = 443
request_handler_timeout_seconds = 300

[server.grpc.certificate]
cert_file = "/etc/letsencrypt/live/lore.rendermoon.com/fullchain.pem"
pkey_file = "/etc/letsencrypt/live/lore.rendermoon.com/privkey.pem"

[server.auth]
jwt_issuer = "https://archigma.com"
jwt_audience = ["lore-service"]

[server.auth.jwk]
endpoint = "https://archigma.com/api/v1/lore/auth/jwks.json"

[environment.endpoint]
auth_url = "ucs-auth://auth.archigma.com"

[immutable_store]
mode = "composite"

[immutable_store.composite]
should_cache_query_results = true

[immutable_store.composite.local]
mode = "local"
local.path = "/data/cache"
local.flush_delay_seconds = 10
local.max_size = 429_496_729_600 # 400 GiB on a roughly 500 GB usable filesystem
local.target_size_percentage = 80
local.compaction_delay = 60_000
local.compaction_parallel_groups = 8

[immutable_store.composite.durable]
mode = "cloudflare"

[mutable_store]
mode = "cloudflare"

[lock_store]
mode = "cloudflare"

[plugins.cloudflare]
# This Worker and its bound Durable Objects/R2 bucket are promoted in place so
# existing LORE repositories retain their addresses and payloads. The service
# name is a legacy resource identity; it must be production-exclusive after
# cutover, and future staging must use newly provisioned resources.
endpoint_url = "https://archigma-lore-do-staging.damian-podwiazka.workers.dev"
auth_shared_secret_env = "LORE_CLOUDFLARE_SHARED_SECRET"
timeout_millis = 15_000

[topology]
provider = "none"
