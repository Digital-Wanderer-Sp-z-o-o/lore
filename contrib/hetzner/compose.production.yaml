name: archigma-lore-production

services:
  lore-server:
    container_name: archigma-lore-production
    image: archigma-lore-server:${LORE_SERVER_TAG:?set LORE_SERVER_TAG to the merged main commit SHA}
    build:
      context: ../..
      dockerfile: lore-server/Dockerfile
      args:
        LORE_BUILD_SHA: ${LORE_SERVER_TAG:?set LORE_SERVER_TAG to the merged main commit SHA}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      LORE_CONFIG_PATH: /etc/lore/config
      LORE_ENV: hetzner
      RUST_LOG: info
    volumes:
      - ./config.production.toml:/etc/lore/config/hetzner.toml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${LORE_PRODUCTION_CACHE_ROOT:-/var/lib/lore/production-cache}:/data/cache
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
