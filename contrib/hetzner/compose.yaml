services:
  lore-server:
    container_name: archigma-lore-staging
    image: archigma-lore-server:${LORE_SERVER_TAG:-staging}
    build:
      context: ../..
      dockerfile: lore-server/Dockerfile
      args:
        LORE_BUILD_SHA: ${LORE_SERVER_TAG:-staging}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      LORE_CONFIG_PATH: /etc/lore/config
      LORE_ENV: hetzner
      RUST_LOG: info
    volumes:
      - ./config.toml:/etc/lore/config/hetzner.toml:ro
      - ${LORE_CACHE_ROOT:-/var/lib/lore/cache}:/data/cache
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
